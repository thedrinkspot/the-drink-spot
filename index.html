<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Drink Spot - Caballito</title>
    <style>
        /* --- ESTILOS GENERALES Y RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* --- BARRA DE NAVEGACIÓN --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            z-index: 1000;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            line-height: 1.1;
            text-decoration: none;
            color: #ffffff;
        }

        .logo span {
            color: #f5a623;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #cccccc;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #f5a623;
        }

        /* --- SECCIÓN PRINCIPAL (HERO) --- */
       .hero {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            /* Apunta exactamente al nombre de tu archivo con espacios y extensión jpeg */
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('img/local - frente.jpeg') no-repeat center center/cover;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .hero h1 span {
            color: #f5a623;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 600px;
            margin-bottom: 30px;
            color: #dddddd;
        }

        /* --- BOTONES --- */
        .btn-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary {
            background-color: #f5a623;
            color: #121212;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #d4881c;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn-whatsapp:hover {
            background-color: #1ebe5d;
        }

        /* --- MEDIA QUERIES (ADAPTACIÓN PARA CELULARES) --- */
        @media (max-width: 768px) {
            header {
                flex-direction: column !important;
                align-items: center !important;
                padding: 12px !important;
                text-align: center;
            }

            .nav-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
                margin-top: 10px;
                font-size: 0.9rem;
            }

            .hero {
                padding-top: 120px; /* Empuja el contenido hacia abajo para que el menú no lo tape */
            }

            .hero h1 {
                font-size: 2.2rem !important;
                line-height: 1.2;
            }

            .hero p {
                font-size: 1rem;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header>
        <a href="#" class="logo">THE DRINK<br><span>SPOT</span></a>
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Rubros</a></li>
            <li><a href="#">El Local</a></li>
            <li><a href="#">Ubicación y Horarios</a></li>
        </ul>
    </header>

    <!-- PORTADA PRINCIPAL -->
    <section class="hero">
        <h1>Las mejores bebidas, <span>siempre frías</span></h1>
        <p>Seleccioná el rubro que estás buscando para explorar todo nuestro catálogo con stock actualizado al instante.</p>
        <div class="btn-container">
            <a href="#" class="btn-primary">Explorar Rubros</a>
            <a href="https://wa.me/" target="_blank" class="btn-whatsapp">Pedir por WhatsApp</a>
        </div>
    </section>

</body>
</html>
